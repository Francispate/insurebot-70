<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsureBot — Log in or Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* Dark base + indigo glow */
      background-color: #0f0f1a;
      background-image: radial-gradient(ellipse 80% 70% at 50% -10%, rgba(99,102,241,0.28) 0%, transparent 65%);
      padding: 1.5rem;
      color: #e2e2f0;
    }
    /* Light theme overrides for body */
    html[data-theme="light"] body {
      background-color: #f4f4fb;
      background-image: radial-gradient(ellipse 80% 70% at 50% -10%, rgba(99,102,241,0.14) 0%, transparent 65%);
      color: #14142a;
    }

    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Sora', sans-serif; font-size: 1.2rem; font-weight: 700;
      color: inherit; text-decoration: none; margin-bottom: 2rem;
    }
    .logo-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }

    .auth-card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 2.25rem;
      backdrop-filter: blur(10px);
    }
    [data-theme="light"] .auth-card {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    /* Tabs */
    .auth-tabs {
      display: flex; background: rgba(0,0,0,0.25); border-radius: 10px;
      padding: 4px; margin-bottom: 1.75rem; gap: 4px;
    }
    [data-theme="light"] .auth-tabs { background: rgba(0,0,0,0.07); }
    .auth-tab {
      flex: 1; padding: 0.55rem; border-radius: 7px;
      border: none; background: transparent; cursor: pointer;
      font-size: 0.875rem; font-weight: 500;
      color: rgba(255,255,255,0.5); transition: all 0.15s;
    }
    [data-theme="light"] .auth-tab { color: rgba(20,20,40,0.5); }
    .auth-tab.active {
      background: rgba(99,102,241,0.25);
      color: #a5b4fc;
    }
    [data-theme="light"] .auth-tab.active {
      background: rgba(99,102,241,0.12); color: #4f46e5;
    }

    /* Form */
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .auth-panel h2 {
      font-family: 'Sora', sans-serif; font-size: 1.35rem; font-weight: 700;
      margin-bottom: 0.35rem;
    }
    .auth-panel .auth-subtitle {
      font-size: 0.85rem; color: rgba(255,255,255,0.5);
      margin-bottom: 1.5rem;
    }
    [data-theme="light"] .auth-panel .auth-subtitle { color: rgba(20,20,40,0.5); }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.82rem; font-weight: 500;
      margin-bottom: 0.4rem; color: rgba(255,255,255,0.7);
    }
    [data-theme="light"] .form-group label { color: rgba(20,20,40,0.7); }
    .form-group input,
    .form-group select {
      width: 100%; padding: 0.65rem 0.85rem; border-radius: 9px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: inherit; font-size: 0.9rem;
      transition: border-color 0.15s;
      box-sizing: border-box;
    }
    [data-theme="light"] .form-group input,
    [data-theme="light"] .form-group select {
      background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.12);
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none; border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .form-row { display: flex; gap: 0.75rem; }
    .form-row .form-group { flex: 1; }

    .remember-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.83rem; color: rgba(255,255,255,0.55);
      margin-bottom: 1.25rem;
    }
    [data-theme="light"] .remember-row { color: rgba(20,20,40,0.55); }
    .remember-row input[type="checkbox"] { accent-color: #6366f1; }

    .btn-auth {
      width: 100%; padding: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none; border-radius: 10px;
      color: #fff; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-auth:hover { opacity: 0.88; }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-footer-link {
      text-align: center; margin-top: 1.25rem;
      font-size: 0.83rem; color: rgba(255,255,255,0.45);
    }
    [data-theme="light"] .auth-footer-link { color: rgba(20,20,40,0.45); }
    .auth-footer-link a { color: #a5b4fc; text-decoration: none; }
    [data-theme="light"] .auth-footer-link a { color: #4f46e5; }
    .auth-footer-link a:hover { text-decoration: underline; }

    .auth-back {
      margin-top: 1.75rem; text-align: center;
      font-size: 0.82rem; color: rgba(255,255,255,0.35);
    }
    [data-theme="light"] .auth-back { color: rgba(20,20,40,0.4); }
    .auth-back a { color: inherit; text-decoration: none; }
    .auth-back a:hover { color: #6366f1; }

    #theme-toggle {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 7px 9px; cursor: pointer;
      color: rgba(255,255,255,0.6); display: flex; align-items: center;
    }
    [data-theme="light"] #theme-toggle {
      background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.12);
      color: rgba(20,20,40,0.6);
    }

    /* Spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <button id="theme-toggle" aria-label="Toggle theme"></button>

  <a href="index.html" class="auth-logo">
    <span class="logo-mark">🛡</span>
    InsureBot
  </a>

  <div class="auth-card">
    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-target="login-panel">Log in</button>
      <button class="auth-tab" data-target="register-panel">Register</button>
    </div>

    <!-- Login panel -->
    <div class="auth-panel active" id="login-panel">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to manage your claims and policies.</p>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div class="remember-row">
          <input type="checkbox" id="remember-me" />
          <label for="remember-me">Remember me</label>
        </div>
        <button type="submit" id="login-submit" class="btn-auth">Log in</button>
      </form>

      <div class="auth-footer-link">
        Don't have an account? <a href="#" class="switch-tab" data-target="register-panel">Register here</a>
      </div>
    </div>

    <!-- Register panel -->
    <div class="auth-panel" id="register-panel">
      <h2>Create account</h2>
      <p class="auth-subtitle">Free forever. No credit card required.</p>

      <form id="register-form" autocomplete="on">
        <div class="form-group">
          <label for="reg-name">Full name</label>
          <input type="text" id="reg-name" name="name" placeholder="Arjun Sharma" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email address</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" placeholder="At least 6 characters" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="reg-country">Country / State</label>
          <select id="reg-country" name="country">
            <option value="">Select state (optional)</option>
            <option>Maharashtra</option>
            <option>Karnataka</option>
            <option>Tamil Nadu</option>
            <option>Delhi</option>
            <option>Uttar Pradesh</option>
            <option>Gujarat</option>
            <option>West Bengal</option>
            <option>Rajasthan</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Other</option>
          </select>
        </div>
        <button type="submit" id="register-submit" class="btn-auth">Create account</button>
      </form>

      <div class="auth-footer-link">
        Already have an account? <a href="#" class="switch-tab" data-target="login-panel">Log in</a>
      </div>
    </div>
  </div>

  <div class="auth-back">
    <a href="index.html">← Back to home</a>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // ── Tab switcher ──
    function activateTab(targetId) {
      document.querySelectorAll(".auth-tab").forEach(t => {
        t.classList.toggle("active", t.dataset.target === targetId);
      });
      document.querySelectorAll(".auth-panel").forEach(p => {
        p.classList.toggle("active", p.id === targetId);
      });
    }

    document.querySelectorAll(".auth-tab").forEach(btn => {
      btn.addEventListener("click", () => activateTab(btn.dataset.target));
    });
    document.querySelectorAll(".switch-tab").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        activateTab(link.dataset.target);
      });
    });

    // ── Open register tab if ?tab=register ──
    const params = new URLSearchParams(window.location.search);
    if (params.get("tab") === "register") activateTab("register-panel");

    // ── Redirect if already logged in ──
    document.addEventListener("DOMContentLoaded", () => {
      if (window.API && API.isLoggedIn()) {
        window.location.href = "/dashboard.html";
      }
    });
  </script>
</body>
</html>
